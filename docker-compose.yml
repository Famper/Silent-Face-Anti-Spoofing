services:
  anti-spoof-api:
    build: .
    expose:
      - "8000"
    volumes:
      - venv_data:/app/.venv
    environment:
      - MODEL_DIR=./resources/anti_spoof_models
      - DEVICE_ID=0
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - anti-spoof-api
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      # Certificates are managed on the host (e.g. by the system certbot
      # package with a systemd timer). Override LETSENCRYPT_DIR if your
      # certs live elsewhere.
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-example.com}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
      - NGINX_ENVSUBST_FILTER=SERVER_NAME
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  venv_data:
